name: 🩺 Installer E2E (P1-E gate)

# PHASE 4/5 proof: the real one-command install must work, pass the
# 12-step health gate, and uninstall cleanly - on every OS we claim.
on:
  push:
    branches: [main, "fix/**", "release/**"]
    paths: ["install_*", "start*", "installer/**", "requirements*",
            "bot.py", "brokers/**", "core/**", "dashboard/**",
            ".github/workflows/installer-e2e.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, script: install_linux.sh }
          - { os: ubuntu-24.04, script: install_linux.sh }
          - { os: macos-13,     script: install_macos.sh }
          - { os: macos-14,     script: install_macos.sh }
          - { os: windows-2022, script: install_windows.ps1 }
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      GR_NONINTERACTIVE: "1"
      GR_E2E: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install (one command)
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            powershell -NoProfile -ExecutionPolicy Bypass \
              -File install_windows.ps1
          else
            bash "${{ matrix.script }}"
          fi

      - name: Health gate passed inside the installer (implicit)
        shell: bash
        run: echo "installer exited 0 -> the 12-step health gate passed"

      - name: Doctor reports (paper default)
        shell: bash
        run: |
          if [ -f "$HOME/.local/share/gold-reaper/app/.venv/bin/python" ]; then
            PY="$HOME/.local/share/gold-reaper/app/.venv/bin/python"
            APP="$HOME/.local/share/gold-reaper/app"
          elif [ -f "$HOME/Library/Application Support/GoldReaper/.venv/bin/python" ]; then
            PY="$HOME/Library/Application Support/GoldReaper/.venv/bin/python"
            APP="$HOME/Library/Application Support/GoldReaper"
          else
            PY="$LOCALAPPDATA/GoldReaper/app/.venv/Scripts/python.exe"
            APP="$LOCALAPPDATA/GoldReaper/app"
          fi
          "$PY" "$APP/cli.py" status || true

      - name: Uninstall
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            powershell -NoProfile -ExecutionPolicy Bypass \
              -File install_windows.ps1 -Uninstall
          else
            bash "${{ matrix.script }}" --uninstall
          fi
          echo "uninstall completed cleanly"
