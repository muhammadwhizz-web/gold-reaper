name: 📺 Pages Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static demo
        run: |
          mkdir -p _site
          cp dashboard/static/index.html _site/index.html
          cp -r dashboard/static/vendor _site/vendor
          cp assets/icon.png _site/favicon.ico
          cp docs/banner.png _site/banner.png
          cp assets/social-preview.png _site/social-preview.png
          python3 - <<'PY'
          # generate the embedded mock dataset so the page runs backend-free
          import json, random, pathlib
          rng = random.Random(666)
          eq, hist = 10000.0, []
          for _ in range(120):
              eq += rng.gauss(6.5, 38.0)
              hist.append(round(eq, 2))
          day = round(hist[-1] - 10000.0, 2)
          trades = []
          px = 2418.0
          for i in range(20):
              px += rng.gauss(1.2, 4.0)
              side = "LONG" if rng.random() > 0.45 else "SHORT"
              pnl = round(rng.gauss(14.2, 26.0), 2)
              trades.append({
                  "ts": f"2026-10-0{8 - i // 5} {9 + i % 9:02d}:{(i * 17) % 60:02d} UTC",
                  "side": side,
                  "size_oz": f"{round(rng.uniform(0.02, 0.05), 3):.3f}",
                  "entry": f"{px:,.2f}", "pnl": f"{pnl:+.2f}",
                  "r": f"{pnl / 100.0:+.2f}",
                  "regime": rng.choice(["TREND_UP", "TREND_DOWN", "RANGE"]),
                  "session": rng.choice(["LONDON_NY_OVERLAP", "LONDON"])})
          dims = [{"name": n, "value": round(rng.uniform(0.25, 0.95), 2),
                   "active": rng.random() < 0.8}
                  for n in ("trend", "order-flow", "volatility", "structure",
                            "statistical", "session", "microstructure",
                            "cross-asset", "news", "regime")]
          # parse the append-only ledger so the Pages demo shows the real one
          led_rows = []
          tr = pathlib.Path("docs/TRACK_RECORD.md")
          if tr.exists():
              for line in tr.read_text(encoding="utf-8").splitlines():
                  if not line.startswith("|") or "---" in line or "date (UTC)" in line:
                      continue
                  c = [x.strip() for x in line.strip("|").split("|")]
                  if len(c) >= 3:
                      led_rows.append({"date": c[0], "trades": c[1], "net": c[2],
                                       "equity": c[3] if len(c) > 3 else "-",
                                       "note": c[5] if len(c) > 5 else ""})
          total = round(sum(float(r["net"].replace("+", "")) for r in led_rows
                            if r["net"].lstrip("+").replace(".", "").isdigit()), 2)
          track = {"rows": led_rows[::-1][:10], "days": len(led_rows),
                   "total_net": total,
                   "source": "docs/TRACK_RECORD.md (append-only)"}
          # analytics mock — derived from the SAME seeded trades so the
          # analytics panel always agrees with the visible table
          pnls = [float(t["pnl"]) for t in trades]
          wins = [p for p in pnls if p > 0]
          losses = [p for p in pnls if p < 0]
          gw, gl = sum(wins), -sum(losses)
          start = 10000.0
          eqp, peak, mdd, mddp, under = start, start, 0.0, 0.0, []
          for p in pnls:
              eqp += p
              peak = max(peak, eqp)
              dd = eqp - peak
              under.append(round(dd / peak * 100, 3) if peak else 0.0)
              if dd < mdd:
                  mdd = dd
                  mddp = round(dd / peak * 100, 2)
          lw = ll = cw = cl = 0
          for p in pnls:
              cw = cw + 1 if p > 0 else 0
              cl = cl + 1 if p < 0 else 0
              lw, ll = max(lw, cw), max(ll, cl)
          lo, hi = min(pnls), max(pnls)
          if hi <= lo:
              hi = lo + 1.0
          k = 8
          width = (hi - lo) / k
          counts = [0] * k
          for p in pnls:
              counts[min(k - 1, max(0, int((p - lo) / width)))] += 1
          histo = {"labels": [f"{lo + width * i:+.0f}..{lo + width * (i + 1):+.0f}"
                             for i in range(k)],
                  "counts": counts,
                  "pos": [(lo + width * i + lo + width * (i + 1)) / 2 >= 0
                          for i in range(k)]}
          by_regime = {}
          for t, p in zip(trades, pnls):
              slot = by_regime.setdefault(t["regime"], {"n": 0, "net": 0.0})
              slot["n"] += 1
              slot["net"] = round(slot["net"] + p, 2)
          metrics = {"n": len(pnls), "wins": len(wins), "losses": len(losses),
                     "win_rate": round(len(wins) / len(pnls) * 100, 1),
                     "pf": round(gw / gl, 2) if gl > 0 else None,
                     "expectancy": round(sum(pnls) / len(pnls), 2),
                     "net": round(sum(pnls), 2),
                     "avg_win": round(gw / len(wins), 2) if wins else None,
                     "avg_loss": round(gl / len(losses), 2) if losses else None,
                     "best": round(max(pnls), 2), "worst": round(min(pnls), 2),
                     "max_drawdown": round(mdd, 2), "max_drawdown_pct": mddp,
                     "longest_win_streak": lw, "longest_loss_streak": ll,
                     "histogram": histo, "underwater": under,
                     "by_regime": by_regime, "start_balance": start,
                     "source": "mock"}
          mock = {"state": {
              "mode": "mock", "ts": "2026-10-09T12:04:33+00:00",
              "equity": hist[-1], "day_pnl": day,
              "week_pnl": round(day + 61.80, 2), "month_pnl": round(day + 214.55, 2),
              "block_pnl": 23.41, "block_target": 20, "block_key": "2026-10-09T12",
              "recovery": False, "latched": False, "wins": 1, "losses": 0,
              "equity_history": hist,
              "equity_source": "marks+fills",
              "equity_times": ["%02d:%02d" % (12 + (i * 5) // 60, (i * 5) % 60)
                               for i in range(len(hist))],
              "equity_mark_idx": [0, 12, 24, 36, 48, 60, 72, 84, 96, 108,
                                  len(hist) - 1],
              "position": {"side": "LONG", "size_oz": 0.028, "entry": 2418.60,
                           "sl": 2417.90, "tp": 2431.20, "opened": "12:04:33 UTC",
                           "be": True, "trail": True, "age_h": 1.7},
              "heartbeat": None, "standby": False, "price": None,
              "session": "london/ny overlap",
              "regime": {"name": "TREND_UP", "confidence": 0.71, "engine": "rules"},
              "dims": dims,
              "brokers": [
                  {"name": "MT5 (Exness)", "state": "standby", "latency_ms": None},
                  {"name": "Bitget", "state": "standby", "latency_ms": None},
                  {"name": "Paper", "state": "up", "latency_ms": 1}],
              "streak": 1, "hunt_window": "12-14 UTC",
              "geometry": "SL 1.2xATR \u00b7 TP 2.0R \u00b7 risk 1%",
              "version": "v3.2.0"},
              "trades": trades, "track_record": track, "metrics": metrics}
          # news radar mock — informational countdowns (client renders them)
          mock_news = {"fetched_at": "2026-10-09T14:02:22+00:00", "events": [
              {"title": "Non-Farm Payrolls", "country": "USD", "impact": "High",
               "iso": "2026-10-09T14:30:00+00:00", "min_until": -18.0},
              {"title": "FOMC Member Speech", "country": "USD", "impact": "Medium",
               "iso": "2026-10-09T18:05:00+00:00", "min_until": 168.0},
              {"title": "Core CPI m/m", "country": "USD", "impact": "High",
               "iso": "2026-10-10T13:30:00+00:00", "min_until": 1350.0},
              {"title": "Crude Oil Inventories", "country": "USD", "impact": "Low",
               "iso": "2026-10-10T15:30:00+00:00", "min_until": 1590.0}],
              "source": "data/news/calendar_latest.json"}
          mock_log = [
              "12:04:31 | scan bar 2415.80 atr 3.4 adx 27 regime TREND_UP",
              "12:04:33 | order executed XAUUSD LONG 0.028 oz @ 2418.60",
              "12:04:33 | stop 2414.28 target 2431.20 r:r 2.0",
              "12:35:02 | protective move stop -> breakeven 2417.90",
              "13:02:48 | trailing engaged +1.5R trail 1.2x atr",
              "13:44:19 | target filled 2431.20 pnl +23.41 (+0.23%)",
              "13:44:19 | block target banked +23.41/20.00 -> standby",
              "14:00:01 | heartbeat: equity 10,023.41 day +23.41 (1W/0L)"]
          with open("_site/mock-data.js", "w") as f:
              f.write("window.MOCK_DATA = " + json.dumps(mock) + ";\n")
              f.write("window.MOCK_LOG = " + json.dumps(mock_log) + ";\n")
              f.write("window.MOCK_NEWS = " + json.dumps(mock_news) + ";\n")
          print("mock dataset embedded (state + trades + metrics + ledger + news)")
          PY
          # inject the static dataset only into the Pages copy (the FastAPI
          # page stays network-driven)
          sed -i 's|<script src="vendor/chart.umd.min.js"></script>|<script src="vendor/chart.umd.min.js"></script><script src="mock-data.js?v=v3.2.0"></script>|' _site/index.html
          grep -c 'mock-data.js' _site/index.html
          cat > _site/.nojekyll <<'EOF'
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
