name: 📺 Pages Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static demo
        run: |
          mkdir -p _site
          cp dashboard/static/index.html _site/index.html
          cp docs/banner.png _site/banner.png
          cp assets/social-preview.png _site/social-preview.png
          python3 - <<'PY'
          # generate the embedded mock dataset so the page runs backend-free
          import json, random
          rng = random.Random(666)
          eq, hist = 10000.0, []
          for _ in range(120):
              eq += rng.gauss(6.5, 38.0)
              hist.append(round(eq, 2))
          day = round(hist[-1] - 10000.0, 2)
          trades = []
          px = 2418.0
          for i in range(20):
              px += rng.gauss(1.2, 4.0)
              side = "LONG" if rng.random() > 0.45 else "SHORT"
              pnl = round(rng.gauss(14.2, 26.0), 2)
              trades.append({
                  "ts": f"2026-10-0{8 - i // 5} {9 + i % 9:02d}:{(i * 17) % 60:02d} UTC",
                  "side": side,
                  "size_oz": f"{round(rng.uniform(0.02, 0.05), 3):.3f}",
                  "entry": f"{px:,.2f}", "pnl": f"{pnl:+.2f}",
                  "regime": rng.choice(["TREND_UP", "TREND_DOWN", "RANGE"])})
          mock = {"state": {
              "mode": "mock", "equity": hist[-1], "day_pnl": day,
              "week_pnl": round(day + 61.80, 2), "month_pnl": round(day + 214.55, 2),
              "block_pnl": 23.41, "block_target": 20, "block_key": "2026-10-09T12",
              "recovery": False, "latched": False, "wins": 1, "losses": 0,
              "equity_history": hist,
              "position": {"side": "LONG", "size_oz": 0.028, "entry": 2418.60,
                           "sl": 2417.90, "tp": 2431.20, "opened": "12:04:33 UTC",
                           "be": True},
              "session": "london/ny overlap", "regime": "TREND_UP"}, "trades": trades}
          mock_log = [
              "12:04:33 | order executed XAUUSD LONG 0.028 oz @ 2418.60",
              "12:04:33 | stop 2414.28 target 2431.20 r:r 2.67",
              "12:35:02 | protective move stop -> breakeven 2417.90",
              "13:02:48 | trailing engaged +1.5R trail 1.2x atr",
              "13:44:19 | target filled 2431.20 pnl +23.41 (+0.23%)",
              "13:44:19 | block target banked +23.41/20.00 -> standby",
              "14:00:01 | heartbeat: equity 10,023.41 day +23.41 (1W/0L)"]
          with open("_site/mock-data.js", "w") as f:
              f.write("window.MOCK_DATA = " + json.dumps(mock) + ";\n")
              f.write("window.MOCK_LOG = " + json.dumps(mock_log) + ";\n")
          print("mock dataset embedded")
          PY
          cat > _site/.nojekyll <<EOF
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
