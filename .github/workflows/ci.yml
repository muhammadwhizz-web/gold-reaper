name: 🔥 Reaper CI (APEX)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install arsenal
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint + type gates (ruff + mypy)
        run: |
          pip install ruff mypy
          ruff check .
          mypy

      - name: Signal diagnosis (offline buckets, quick mode)
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, '.')
          from research.diagnose import _bucket, hourly_vol_rank, _VOL_BUCKETS
          import pandas as pd
          df = pd.DataFrame([{"entry_ts": pd.Timestamp("2024-06-05 12:00", tz="UTC"),
                              "pnl": 10.0, "trace": "trend"}])
          tbl = _bucket(df, lambda ts: ts.hour)
          assert tbl["n"].sum() == 1
          assert [b[2] for b in _VOL_BUCKETS] == ["V<20", "V20-40", "V40-60", "V60-80", "V>80"]
          print("diagnose helpers OK | buckets:", len(tbl))
          PY

      - name: Visual asset forges (social preview + header svg)
        run: |
          python assets/make_social.py --out /tmp/social-check.png
          python - <<'PY'
          import xml.etree.ElementTree as ET, pathlib
          root = ET.parse("assets/header.svg").getroot()
          assert root.get("viewBox") == "0 0 1200 300"
          sp = pathlib.Path("assets/social-preview.png")
          from PIL import Image
          im = Image.open(sp); assert im.size == (1280, 640), im.size
          print("header.svg valid | social-preview 1280x640 OK")
          PY

      - name: Demo artifacts present (cast + gif + mp4)
        run: |
          for f in demo/gold-reaper-demo.cast demo/gold-reaper-demo.gif demo/gold-reaper-demo.mp4; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
          echo "demo artifacts OK"

      - name: Blood test (imports + strategy + risk + regime + ensemble)
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, '.')
          import numpy as np, pandas as pd
          from core.config import CONFIG
          from core.strategy import ReaperX
          from core.strategy_apex import ApexX
          from core.regime import RegimeDetector
          from core.risk_apex import ApexRisk, BLOCK_TARGET
          from core.news_brain import NewsBrain
          from core.notify import notify
          from core import audit
          from features.store import FeatureStore
          from features.build_features import build_features, triple_barrier
          from core.indicators import ema, rsi, atr, adx

          # synthetic 1h frame (series index MUST match frame index)
          n = 1600
          idx = pd.date_range("2024-01-01", periods=n, freq="1h", tz="UTC")
          rng = np.random.default_rng(666)
          close = pd.Series(np.cumsum(rng.normal(0, 3, n)) + 2000, index=idx)
          df = pd.DataFrame({"open": close.shift(1).fillna(close.iloc[0]),
                             "high": close + 4, "low": close - 4, "close": close,
                             "volume": np.abs(rng.normal(1000, 200, n))},
                            index=idx)

          # indicators alive
          assert not adx(df).isna().all(), "ADX broken"

          # feature forge (no cross-asset/news in CI - offline deterministic)
          X = build_features(df, None, with_labels=False, verbose=False)
          fcols = [c for c in X.columns if c.startswith("f_")]
          assert len(fcols) > 80, f"feature forge collapsed: {len(fcols)}"
          cov = X[fcols].notna().mean()
          print(f"feature coverage: mean {cov.mean():.3f} | min {cov.min():.3f} "
                f"| cols<0.3: {(cov < 0.3).sum()}")
          assert cov.isna().sum() == 0, "all-NaN feature column produced"
          assert (cov >= 0.3).mean() > 0.85, \
              f"too many starved feature columns: {(cov < 0.3).sum()}/{len(fcols)}"

          # triple barrier sane
          lab = triple_barrier(df, 2.0, 1.2, 24)
          assert lab["label_tp_before_sl"].notna().sum() > n * 0.9, "labels broken"

          # regime router
          rd = RegimeDetector()
          rstate = rd.classify(df.tail(300))
          assert rstate.regime in ("TREND_UP","TREND_DOWN","RANGE","VOLATILE_CHOP","CRISIS")

          # ensemble abstains on noise (must not crash, must return None or Signal)
          ax = ApexX()
          h4 = df.resample("4h").agg({"open":"first","high":"max","low":"min","close":"last"}).dropna()
          from core.news_brain import NewsState
          sig = ax.evaluate(df.iloc[:-1], h4, df.index[-1].to_pydatetime(),
                            X.iloc[-2].to_dict(), rstate, NewsState(), None)
          print("ensemble OK | regime:", rstate.regime, "| signal:", bool(sig),
                "| features:", len(fcols))

          # apex risk engine
          ar = ApexRisk()
          oz, risk_usd = ar.position_size_oz(2000.0, 1990.0)
          assert oz > 0 and risk_usd > 0, "apex sizing broken"
          ok, why = ar.can_open(0.9)
          print("risk engine OK | size:", oz, "oz | risk $", round(risk_usd,2),
                "| gate:", why, "| block target:", BLOCK_TARGET)

          # audit + notify pipelines
          audit.log_event("lifecycle", {"event": "ci"})
          rep = notify("CI", "apex blood test passed")
          print("audit+notify OK | channels:", rep)
          PY

      - name: Store round-trip (DuckDB)
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, '.')
          import pandas as pd, numpy as np
          from features.store import FeatureStore
          import tempfile, pathlib
          p = pathlib.Path(tempfile.mkdtemp()) / "t.duckdb"
          s = FeatureStore(p)
          df = pd.DataFrame({"open":[1,2],"high":[2,3],"low":[0,1],"close":[1.5,2.5],
                             "volume":[10,20]},
                            index=pd.date_range("2024-01-01", periods=2, freq="1h", tz="UTC"))
          s.write_bars("1h", df); s.write_bars("1h", df)   # idempotent
          back = s.read_bars("1h")
          assert len(back) == 2, "duckdb idempotency broken"
          print("store round-trip OK | tables:", s.tables())
          s.close()
          PY

      - name: Demo layer checks (terminal + dashboard imports)
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, '.')
          # terminal demo module imports cleanly
          import importlib.util
          spec = importlib.util.spec_from_file_location("tdemo", "demo/terminal_demo.py")
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          assert callable(m.main)
          # dashboard app imports + mock payloads coherent
          from dashboard.app import state_payload, trades_payload, metrics_payload
          s = state_payload(); t = trades_payload(); m = metrics_payload()
          assert {"equity","day_pnl","equity_history"} <= set(s)
          assert isinstance(t, dict) and t["mode"] == "mock" and len(t["rows"]) >= 1
          assert m["source"] == "mock" and m["n"] >= 1 and "histogram" in m
          assert m["n"] == len(t["rows"])  # analytics agree with the table
          print("demo layers OK | state mode:", s["mode"],
                "| trades:", len(t["rows"]), "| metrics n:", m["n"],
                "| pf:", m["pf"], "| wr:", m["win_rate"])
          PY

      - name: Reaper is alive
        if: success()
        run: echo "APEX blood test green - the hunter lives"

  # ════════════════════════════════════════════════════════════════
  # cross-platform installer suite: every OS the installers target,
  # every python the bot supports (3.10 / 3.11 / 3.12 spread)
  # ════════════════════════════════════════════════════════════════
  install-suite:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  py: "3.10", label: "linux  py3.10" }
          - { os: macos-latest,   py: "3.11", label: "macos  py3.11" }
          - { os: windows-latest, py: "3.12", label: "win32  py3.12" }
    name: install-suite (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: Install requirements (MetaTrader5 auto-marked win32)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Universal compatibility probe (imports + factory + wizard headless)
        shell: python
        run: |
          import os, subprocess, sys
          sys.path.insert(0, ".")
          from pathlib import Path

          # core modules import on every OS (MT5 guarded on linux/mac)
          from brokers.factory import create_broker, failover_chain, normalize
          from brokers.health import retry_call, HealthMonitor
          from core.config import Config

          assert normalize("exness") == "MT5"
          cfg = Config()
          chain = failover_chain(cfg)
          assert chain[-1] == "PAPER", chain
          b = create_broker(cfg, "PAPER")
          assert b.connect() and b.balance() > 0
          print("factory OK | chain:", chain, "| broker:", type(b).name)

          # retry engine backoff order
          import itertools, time
          calls = {"n": 0}
          def flaky():
              calls["n"] += 1
              if calls["n"] < 3: raise RuntimeError("boom")
              return "alive"
          t0 = time.time()
          assert retry_call(flaky, attempts=5, base=0.05, cap=0.1) == "alive"
          assert calls["n"] == 3
          print("retry_call OK | attempts:", calls["n"])

          # wizard headless writes .env (paper mode)
          env = Path(".env")
          if env.exists(): env.unlink()
          r = subprocess.run([sys.executable, "-m", "setup.wizard",
                              "--non-interactive", "--broker", "paper",
                              "--risk", "0.5"],
                             capture_output=True, text=True, timeout=120)
          assert r.returncode == 0, r.stdout + r.stderr
          txt = env.read_text(encoding="utf-8")
          assert "BROKER=PAPER" in txt and "PAPER_MODE=true" in txt
          assert "RISK_PER_TRADE_PCT=0.5" in txt
          print("wizard headless OK | .env written")
          env.unlink()

          # MT5 marker: present only on windows
          try:
              import MetaTrader5  # noqa
              assert os.name == "nt", "MetaTrader5 imported on non-windows?!"
              print("MetaTrader5 present on windows runner")
          except ImportError:
              print("MetaTrader5 absent (expected on", sys.platform, ")")

          # bot module imports (version + heartbeat helpers)
          import bot
          assert bot.VERSION and callable(bot._write_heartbeat)
          print("bot import OK | version:", bot.VERSION)

      - name: Watchdog single cycle
        run: python watchdog.py --once

      - name: Icon forge determinism
        shell: python
        run: |
          import subprocess, sys, tempfile
          from pathlib import Path
          out = Path(tempfile.mkdtemp())
          r = subprocess.run([sys.executable, "assets/make_icon.py",
                              "--out", str(out)], capture_output=True, text=True)
          assert r.returncode == 0, r.stderr
          for name in ("icon.png", "icon.ico", "icon.icns", "icon-tray.png"):
              f = out / name
              assert f.exists() and f.stat().st_size > 1000, name
          print("icon forge OK |", [p.name for p in out.iterdir()])

      - name: Platform suite green
        if: success()
        run: echo "${{ matrix.label }} - installer suite green"
