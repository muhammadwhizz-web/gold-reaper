name: 🐍 Snake Hunt

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6h the snake feeds
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (dark + light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#ff1744&color_dots=#0d1117,#3d0a0f,#8b0000,#dc143c,#ff1744,#ff5252
            dist/snake-dark.svg?palette=github-dark&color_snake=#00e676&color_dots=#161b22,#0b3d1f,#0a5c2f,#0f8a3d,#00c853,#69f0ae

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
